apiVersion: v1
kind: Service

metadata:
  name: tempo
  namespace: lgtm

spec:
  selector:
    app: tempo

  ports:
    - port: {{ .Values.tempo.service.backend }}
      targetPort: {{ .Values.tempo.service.backend }}
    - port: {{ .Values.tempo.service.grpc }}
      targetPort: {{ .Values.tempo.service.grpc }}
    - port: {{ .Values.tempo.service.http }}
      targetPort: {{ .Values.tempo.service.http }}