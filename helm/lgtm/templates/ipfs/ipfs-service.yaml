apiVersion: v1
kind: Service

metadata:
  name: ipfs
  namespace: lgtm

spec:
  selector:
    app: ipfs

  ports:
  - port: {{ index .Values.ipfs.service.ports 0 }}
    targetPort: {{ index .Values.ipfs.service.ports 0 }}
  - port: {{ index .Values.ipfs.service.ports 1 }}
    targetPort: {{ index .Values.ipfs.service.ports 1 }}
  - port: {{ index .Values.ipfs.service.ports 2 }}
    targetPort: {{ index .Values.ipfs.service.ports 2 }}