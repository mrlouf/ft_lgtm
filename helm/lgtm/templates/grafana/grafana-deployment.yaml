apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: lgtm

  annotations:
    checksum/datasources: {{ .Files.Get "files/grafana/provisioning/datasources/datasources.yaml" | sha256sum }}
    checksum/dashboards: {{ .Files.Get "files/grafana/provisioning/dashboards/dashboards.yaml" | sha256sum }}

spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}@{{ .Values.grafana.image.digest }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}

          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml

            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards

          ports:
            - containerPort: {{ .Values.grafana.service.port }}

      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards