apiVersion: apps/v1
kind: Deployment

metadata:
  name: loki
  namespace: lgtm

  annotations:
    checksum/config: {{ .Files.Get "files/loki.yaml" | sha256sum }}

spec:
  replicas: {{ .Values.loki.replicaCount }}
  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki

    spec:
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}@{{ .Values.loki.image.digest }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
          args: ["-config.file=/etc/loki/loki.yaml"]

          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml

          ports:
            - name: grpc
              containerPort: {{ .Values.loki.service.grpc.port }}
            - name: http
              containerPort: {{ .Values.loki.service.http.port }}

      volumes:
        - name: loki-config
          configMap:
            name: loki-config