apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: lgtm

  annotations:
    checksum/config: {{ .Files.Get "files/prometheus-config.yaml" | sha256sum }}

spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}@{{ .Values.prometheus.image.digest }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args: ["--config", "/etc/prometheus/prometheus.yaml"]

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus

          ports:
              containerPort: {{ .Values.prometheus.service.port }}

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config